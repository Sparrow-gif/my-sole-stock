<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bata Sole Stock</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>

body{
background:#f7f8fa;
}

/* HEADER */
.header{
position:sticky;
top:0;
background:#c40000;
padding:12px;
z-index:100;
}

.header input{
border-radius:30px;
}

/* CARD */
.sole-card{
background:#fff;
border-radius:12px;
padding:10px;
margin-bottom:12px;
display:flex;
gap:12px;
transition:.3s;
box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.sole-card:hover{
transform:scale(1.02);
}

.sole-img{
width:90px;
height:90px;
border-radius:10px;
object-fit:cover;
cursor:pointer;
}

.price{
color:#c40000;
font-weight:700;
}

.size{
background:#ffeaea;
color:#c40000;
padding:3px 10px;
border-radius:20px;
font-size:12px;
}

/* MODAL GALLERY */
.modal-content{
border-radius:16px;
overflow:hidden;
background:#000;
}

.modal-body{
height:70vh;
display:flex;
align-items:center;
justify-content:center;
position:relative;
}

.modal-body img{
max-width:100%;
max-height:100%;
object-fit:contain;
}

.nav-btn{
position:absolute;
top:50%;
transform:translateY(-50%);
font-size:28px;
color:#fff;
cursor:pointer;
background:rgba(0,0,0,.4);
width:42px;
height:42px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
}

.left{left:10px;}
.right{right:10px;}

</style>
</head>

<body>

<div id="app">

<!-- HEADER -->
<div class="header">
<input class="form-control"
placeholder="Search code, name, price..."
v-model="search">
</div>

<div class="container mt-2">

<div v-for="item in filtered" class="sole-card">

<img :src="item.images[0]"
class="sole-img"
@click="openGallery(item.images)">

<div class="flex-grow-1">

<div class="fw-bold">{{item.name}}</div>
<div class="text-muted small">Code: {{item.code}}</div>

<div class="mt-1">
<span class="size">Size: {{item.sizes}}</span>
</div>

<div class="price mt-1">₹{{item.price}}</div>

</div>

</div>

</div>

<!-- BOOTSTRAP MODAL -->
<div class="modal fade" id="galleryModal" tabindex="-1">
<div class="modal-dialog modal-dialog-centered">

<div class="modal-content">

<div class="modal-body">

<div class="nav-btn left" @click="prev">❮</div>

<img :src="gallery[index]">

<div class="nav-btn right" @click="next">❯</div>

</div>

</div>
</div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

Vue.createApp({

data(){
return{
items:[],
search:"",
gallery:[],
index:0,
modal:null
}
},

computed:{
filtered(){
let s=this.search.toLowerCase();
return this.items.filter(i =>
i.name.toLowerCase().includes(s) ||
i.code.toLowerCase().includes(s) ||
i.price.toString().includes(s)
);
}
},

methods:{

openGallery(imgs){
this.gallery=imgs;
this.index=0;
this.modal.show();
},

next(){
this.index=(this.index+1)%this.gallery.length;
},

prev(){
this.index=(this.index-1+this.gallery.length)%this.gallery.length;
}

},

mounted(){

fetch("https://sparrow-gif.github.io/my-sole-stock/data.json")
.then(res=>res.json())
.then(d=>this.items=d);

this.modal=new bootstrap.Modal(document.getElementById("galleryModal"));

}

}).mount("#app");

</script>

</body>
</html>
