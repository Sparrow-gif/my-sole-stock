<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bata Sole Stock</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>

body{
background:#f7f8fa;
}

/* HEADER */
.header{
position:sticky;
top:0;
background:#c40000;
padding:12px;
z-index:100;
}

.header input{
border-radius:30px;
}

/* CARD */
.sole-card{
background:#fff;
border-radius:12px;
padding:10px;
margin-bottom:12px;
display:flex;
gap:12px;
transition:.3s;
box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.sole-card:hover{
transform:scale(1.02);
}

.sole-img{
width:90px;
height:90px;
border-radius:10px;
object-fit:cover;
cursor:pointer;
}

.price{
color:#c40000;
font-weight:700;
}

.size{
background:#ffeaea;
color:#c40000;
padding:3px 10px;
border-radius:20px;
font-size:12px;
}

/* POPUP */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.75);
backdrop-filter:blur(6px);
display:flex;
align-items:center;
justify-content:center;
animation:fade .3s;
}

@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}

.gallery{
position:relative;
animation:scale .3s;
}

@keyframes scale{
from{transform:scale(.85);}
to{transform:scale(1);}
}

.gallery img{
max-width:92%;
border-radius:12px;
}

.nav{
position:absolute;
top:50%;
transform:translateY(-50%);
font-size:32px;
color:#fff;
cursor:pointer;
}

.left{left:-40px;}
.right{right:-40px;}

.close{
position:absolute;
top:-10px;
right:-10px;
background:#fff;
color:#c40000;
border-radius:50%;
width:35px;
height:35px;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
cursor:pointer;
}

</style>
</head>

<body>

<div id="app">

<!-- HEADER -->
<div class="header">
<input class="form-control"
placeholder="Search code, name, price..."
v-model="search">
</div>

<div class="container mt-2">

<div v-for="item in filtered" class="sole-card">

<img :src="item.images[0]"
class="sole-img"
@click="openGallery(item.images)">

<div class="flex-grow-1">

<div class="fw-bold">{{item.name}}</div>
<div class="text-muted small">Code: {{item.code}}</div>

<div class="mt-1">
<span class="size">Size: {{item.sizes}}</span>
</div>

<div class="price mt-1">₹{{item.price}}</div>

</div>

</div>

</div>

<!-- POPUP -->
<div v-if="gallery.length"
class="overlay"
@click.self="closeGallery">

<div class="gallery">

<div class="close" @click="closeGallery">✖</div>

<div class="nav left" @click="prev">❮</div>

<img :src="gallery[index]">

<div class="nav right" @click="next">❯</div>

</div>

</div>

</div>

<script>

Vue.createApp({

data(){
return{
items:[],
search:"",
gallery:[],
index:0
}
},

computed:{
filtered(){
let s=this.search.toLowerCase();
return this.items.filter(i =>
i.name.toLowerCase().includes(s) ||
i.code.toLowerCase().includes(s) ||
i.price.toString().includes(s)
);
}
},

methods:{

openGallery(imgs){
this.gallery=imgs;
this.index=0;
},

closeGallery(){
this.gallery=[];
},

next(){
this.index=(this.index+1)%this.gallery.length;
},

prev(){
this.index=(this.index-1+this.gallery.length)%this.gallery.length;
}

},

mounted(){
fetch("data.json")
.then(res=>res.json())
.then(d=>this.items=d);
}

}).mount("#app");

</script>

</body>
</html>
