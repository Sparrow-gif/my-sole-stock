<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sole Stock</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>

body{background:#f4f6f9;}

.header{
position:sticky;
top:0;
background:#fff;
padding:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
z-index:100;
}

.product-card{
background:#fff;
border-radius:12px;
padding:10px;
margin-bottom:12px;
display:flex;
gap:10px;
}

.product-img{
width:90px;
height:90px;
border-radius:10px;
object-fit:cover;
cursor:pointer;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.85);
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
}

.overlay img{
max-width:90%;
border-radius:10px;
}

.nav-btn{
position:absolute;
top:50%;
transform:translateY(-50%);
font-size:30px;
color:#fff;
cursor:pointer;
user-select:none;
}

.left{left:10px;}
.right{right:10px;}

.close-btn{
position:absolute;
top:10px;
right:15px;
font-size:25px;
color:#fff;
cursor:pointer;
}

</style>
</head>

<body>

<div id="app">

<div class="header">
<input class="form-control" placeholder="Search sole..."
v-model="search">
</div>

<div class="container mt-2">

<div v-for="item in filtered" class="product-card">

<img :src="item.images[0]" class="product-img"
@click="openGallery(item.images)">

<div class="flex-grow-1">

<div class="fw-bold">{{item.name}}</div>
<div class="text-muted small">Code: {{item.code}}</div>

<div class="mt-1 badge bg-light text-dark">
Size: {{item.size}}
</div>

</div>

</div>

</div>

<!-- Overlay -->
<div v-if="gallery.length" class="overlay">

<div class="close-btn" @click="closeGallery()">✖</div>

<div class="nav-btn left" @click="prev()">❮</div>

<img :src="gallery[index]">

<div class="nav-btn right" @click="next()">❯</div>

</div>

</div>

<script>

Vue.createApp({

data(){
return{
items:[],
search:"",
gallery:[],
index:0
}
},

computed:{
filtered(){
let s=this.search.toLowerCase();
return this.items.filter(i =>
i.name.toLowerCase().includes(s) ||
i.code.toLowerCase().includes(s)
);
}
},

methods:{

openGallery(imgs){
this.gallery=imgs;
this.index=0;
},

closeGallery(){
this.gallery=[];
},

next(){
this.index=(this.index+1)%this.gallery.length;
},

prev(){
this.index=(this.index-1+this.gallery.length)%this.gallery.length;
}

},

mounted(){
fetch("data.json")
.then(res=>res.json())
.then(d=>this.items=d);
}

}).mount("#app");

</script>

</body>
</html>
